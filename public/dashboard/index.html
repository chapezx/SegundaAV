<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel</title>
    <!-- Reaproveita o estilo do site e acrescenta o estilo do painel -->
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/dashboard/painel.css">
</head>

<body>
    <main>
        <nav class="topo">
            <a href="/">Voltar ao início</a>
            <!-- Botão Sair: fica escondido até o painel.js confirmar que há sessão -->
            <form method="post" action="/oauth/logout" id="form-sair" hidden>
                <button type="submit">Sair</button>
            </form>
        </nav>

        <h1>Painel</h1>
        <p id="saudacao">Consultando a sessão...</p>

        <!-- Três indicadores preenchidos pelo painel.js -->
        <section class="indicadores">
            <div class="indicador">
                <span class="nome">Servidor</span>
                <strong id="servidor">...</strong>
            </div>
            <div class="indicador">
                <span class="nome">Sessão</span>
                <strong id="sessao">...</strong>
            </div>
            <div class="indicador">
                <span class="nome">Provedor</span>
                <strong id="provedor">...</strong>
            </div>
        </section>

        <!-- Dados da conta: aparecem só quando /api/me responde 200 -->
        <section id="dados" hidden>
            <h2>Seus dados</h2>
            <dl>
                <dt>Nome</dt>
                <dd id="nome">-</dd>
                <dt>E-mail</dt>
                <dd id="email">-</dd>
                <dt>Identificador</dt>
                <dd id="identificador">-</dd>
            </dl>
        </section>

        <p class="aviso">
            Esta página é um arquivo estático da pasta <code>public</code>: qualquer pessoa abre pela URL,
            mesmo sem login. O que é protegido são os dados vindos de <code>/api/me</code>.
        </p>
    </main>

    <script src="/dashboard/painel.js"></script>
</body>

</html>
